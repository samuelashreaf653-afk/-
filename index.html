<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>بوابة الطالب الأكاديمية</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

    <!-- ============ شاشة تسجيل الدخول ============ -->
    <section id="loginView" class="login">
        <div class="login-bg-overlay"></div>
        <form class="login-card" id="loginForm" autocomplete="off">
            <div class="brand">
                <div class="logo">🎓</div>
                <h1>بوابة الطالب الأكاديمية</h1>
                <p>تسجيل الدخول لعرض سجلك الأكاديمي</p>
            </div>

            <div class="field">
                <label for="studentId">الرقم الجامعي أو اسم المستخدم</label>
                <input id="studentId" type="text" placeholder="اكتب student أو 20230145" required />
            </div>
            <div class="field">
                <label for="password">كلمة المرور</label>
                <input id="password" type="password" placeholder="••••••" required />
            </div>

            <div class="error" id="loginError"></div>
            <button class="btn" type="submit">تسجيل الدخول</button>
            <p class="hint">بيانات التجربة — المستخدم: <b>student</b> (أو <b>20230145</b>) · كلمة المرور: <b>1234</b></p>
        </form>
    </section>

    <!-- ============ واجهة المنصة ============ -->
    <div id="portalView" class="portal hidden">
        <aside class="sidebar">
            <div class="side-brand">
                <div class="logo">🎓</div>
                <span>البوابة الأكاديمية<small>نظم معلومات الأعمال (BIS)</small></span>
            </div>
            <nav class="nav" id="nav"></nav>
            <button class="logout" id="logoutBtn">🚪 تسجيل الخروج</button>
        </aside>

        <main class="main">
            <div class="topbar">
                <div>
                    <h2 id="welcome">أهلاً بك</h2>
                    <p id="welcomeSub"></p>
                </div>
                <div class="avatar" id="avatar">أ</div>
            </div>
            <div id="content" class="content-area"></div>
        </main>
    </div>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
